[project]
name = "positions"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "stocks-shared",
    "google-auth",
    "google-auth-oauthlib",
    "google-api-python-client",
    "streamlit",  # run_console.py — the merge / run console
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["src"]
